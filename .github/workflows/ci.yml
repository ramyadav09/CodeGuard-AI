name: CodeGuard AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Backend Lint (Ruff)
        run: |
          cd backend
          ruff check app/
          ruff format --check app/

      - name: Run Backend Pytest Suite with Coverage
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85

  frontend:
    name: Frontend — Lint, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Lint (oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Backend Server (background)
        run: |
          cd backend
          DATABASE_URL="sqlite+aiosqlite:///./test_ci.db" \
          AI_PROVIDER="mock" \
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db

      - name: Build Frontend for E2E
        run: |
          cd frontend
          npm run build

      - name: Run Playwright End-to-End Tests
        run: |
          cd frontend
          npx playwright test
        env:
          CI: true
